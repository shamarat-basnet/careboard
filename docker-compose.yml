# Production-like stack: PostgreSQL + FastAPI + nginx-served React build.
#   docker compose up --build        -> http://localhost:3000
# For hot reloading during development, layer on the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-healthcare}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}", "http://localhost:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Login. The first account is created at start-up if no users exist yet.
      # Defaults are for local demos only: set real values before exposing this anywhere.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe-Demo-2026}
      ADMIN_NAME: ${ADMIN_NAME:-Dr. Admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SEED_PATIENT_COUNT: ${SEED_PATIENT_COUNT:-150}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-template}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      target: prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"

volumes:
  pgdata:
